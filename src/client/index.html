<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sweeparr</title>
    <style>
      /* Inline critical styles to prevent flash of wrong background */
      :root {
        --bg-primary: 30, 26, 24;
        --color-primary: 249, 115, 22;
      }
      html, body {
        background-color: rgb(30, 26, 24);
        margin: 0;
        padding: 0;
      }
      /* Loading screen styles */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgb(30, 26, 24);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      #loading-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #loading-screen.hidden {
        display: none;
      }
      .loader-container {
        position: relative;
        width: 120px;
        height: 90px;
      }
      .broom {
        position: absolute;
        bottom: 8px;
        left: 50%;
        width: 50px;
        height: 50px;
        transform-origin: center bottom;
        animation: sweep-arc 1.5s ease-in-out infinite;
      }
      @keyframes sweep-arc {
        0%, 100% { 
          transform: translateX(-50%) rotate(-35deg);
        }
        50% { 
          transform: translateX(-50%) rotate(35deg);
        }
      }
    </style>
  </head>
  <body>
    <!-- Loading screen with broom animation -->
    <div id="loading-screen">
      <div class="loader-container">
        <svg class="broom" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Broom handle -->
          <rect x="30" y="4" width="4" height="32" rx="2" fill="#8B7355"/>
          <!-- Broom head binding -->
          <rect x="26" y="34" width="12" height="6" rx="1" fill="#5D4E37"/>
          <!-- Broom bristles -->
          <path d="M22 40 L26 40 L24 58 L20 58 Z" fill="#F97316"/>
          <path d="M26 40 L30 40 L28 60 L24 60 Z" fill="#EA580C"/>
          <path d="M30 40 L34 40 L32 60 L28 60 Z" fill="#F97316"/>
          <path d="M34 40 L38 40 L36 60 L32 60 Z" fill="#EA580C"/>
          <path d="M38 40 L42 40 L44 58 L40 58 Z" fill="#F97316"/>
        </svg>
      </div>
    </div>
    
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
