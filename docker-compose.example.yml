# Sweeparr Docker Compose Example
# 
# Copy this file to docker-compose.yml and adjust values for your setup.
# See README.md for detailed configuration documentation.

services:
  sweeparr:
    image: ghcr.io/dawnofsoap/sweeparr:development-alpha
    container_name: sweeparr
    restart: unless-stopped
    
    ports:
      - "8484:8080"
    
    environment:
      # =============================================
      # GENERAL SETTINGS
      # =============================================
      
      # Timezone (for scheduled tasks and logs)
      # Required: No | Default: America/Chicago
      - TZ=America/Chicago
      
      # User/Group IDs for file permissions
      # Match these to your media stack for consistent permissions
      # Required: No | Default: 1000
      - PUID=1000
      - PGID=1000
      
      # =============================================
      # ADVANCED SETTINGS (rarely need changing)
      # =============================================
      
      # Environment mode
      # Required: No | Default: production
      # - NODE_ENV=production
      
      # Database location (inside container)
      # Required: No | Default: file:/config/sweeparr.db
      # - DATABASE_URL=file:/config/sweeparr.db
    
    volumes:
      # =============================================
      # REQUIRED VOLUMES
      # =============================================
      
      # Config and database storage
      # This is where Sweeparr stores its SQLite database and settings
      - ./config:/config
      
      # =============================================
      # OPTIONAL VOLUMES
      # =============================================
      
      # Log storage
      # Application logs will be written here
      - ./logs:/logs
      
      # Leaving Soon symlink destination
      # Required if using the "Leaving Soon" feature
      # Must be READ-WRITE for symlink creation
      # This path should also be accessible by your media server
      - ./leaving-soon:/data/leaving-soon
      
      # Media library access (READ-ONLY recommended for safety)
      # Only needed if Sweeparr needs direct access to media files
      # Uncomment and adjust paths as needed:
      # - /mnt/media/movies:/data/media/movies:ro
      # - /mnt/media/tv:/data/media/tv:ro
    
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

