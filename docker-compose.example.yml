# Sweeparr Docker Compose Example
# 
# Copy this file to docker-compose.yml and create a .env file from .env.example
# See README.md for detailed configuration documentation.

services:
  sweeparr:
    image: ghcr.io/dawnofsoap/sweeparr:${SWEEPARR_VERSION:-development-alpha}
    container_name: sweeparr
    restart: unless-stopped
    ports:
      - "${SWEEPARR_PORT:-8484}:8080"
    environment:
      - TZ=${TZ:-America/Chicago}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - NODE_ENV=production
      - DATABASE_URL=file:/config/sweeparr.db
    volumes:
      # Required: Config and database
      - ${CONFIG_PATH:-./config}:/config
      
      # Optional: Logs
      - ${LOG_PATH:-./logs}:/logs
      
      # Leaving Soon (required for symlink feature)
      - ${LEAVING_SOON_PATH:-./leaving-soon}:/data/leaving-soon
      
      # Media libraries (uncomment if direct access needed)
      # - ${MEDIA_MOVIES_PATH}:/data/media/movies:ro
      # - ${MEDIA_TV_PATH}:/data/media/tv:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
